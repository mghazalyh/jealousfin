name: Public custom Surf MPEG-TS acceptance
on:
  push:
    branches: [diagnostics/jellyfin-connection-only]
    paths: ['.github/workflows/jellyfin-custom-surf.yml']
  workflow_dispatch:
permissions: {}
jobs:
  surf:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install decoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Verify exact browser route, authorization and continuous media
        env:
          JELLYFIN_TEST_URL: ${{ secrets.JELLYFIN_TEST_URL }}
          JELLYFIN_TEST_USERNAME: ${{ secrets.JELLYFIN_TEST_USERNAME }}
          JELLYFIN_TEST_PASSWORD: ${{ secrets.JELLYFIN_TEST_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request as R,urllib.error as E,urllib.parse as U,ssl,time,uuid,subprocess,sys
          base=os.environ["JELLYFIN_TEST_URL"].strip().rstrip("/")
          p=U.urlsplit(base)
          if p.scheme!="https" or p.hostname!="desktop-hb9oshs.tail1fc8b.ts.net" or p.username or p.password or p.query or p.fragment: sys.exit("Unexpected public URL")
          class NoRedirect(R.HTTPRedirectHandler):
              def redirect_request(self,*args): return None
          op=R.build_opener(NoRedirect(),R.HTTPSHandler(context=ssl.create_default_context()))
          token=None
          stage="startup"
          auth='MediaBrowser Client="Surf public route test", Device="GitHub Actions", DeviceId="'+uuid.uuid4().hex+'", Version="1"'
          def request(path,method="GET",body=None,authorized=False):
              h={"Cache-Control":"no-cache"}
              if authorized:
                  if not token: raise ValueError("no token")
                  h["X-Emby-Token"]=token
                  h["Authorization"]=auth+', Token="'+token+'"'
              elif path=="/Users/AuthenticateByName": h["Authorization"]=auth
              if body is not None: h["Content-Type"]="application/json"
              return op.open(R.Request(base+path,headers=h,method=method,data=json.dumps(body).encode() if body is not None else None),timeout=18)
          def small(path,method="GET",body=None,authorized=False):
              with request(path,method,body,authorized) as r:
                  data=r.read(1000001)
                  if len(data)>1000000: raise ValueError("response too large")
                  return data
          def reject(path):
              try:
                  with request(path) as r: raise ValueError("unauthenticated request unexpectedly allowed")
              except E.HTTPError as e:
                  if e.code!=401: raise
          errors=0
          try:
              stage="public player JS"
              for f in ("surf-ps3.js","surf-ps3-controls.js"):
                  src=small("/web/"+f+"?verify="+uuid.uuid4().hex)
                  if b"location.protocol === 'https:' ? location.origin" not in src: raise ValueError("HTTPS origin patch not served")
              stage="authentication"
              login=json.loads(small("/Users/AuthenticateByName","POST",{"Username":os.environ["JELLYFIN_TEST_USERNAME"],"Pw":os.environ["JELLYFIN_TEST_PASSWORD"]}))
              token=login["AccessToken"]
              print("::add-mask::"+token,flush=True)
              for mode in ("movies-series","sports","all"):
                  try:
                      stage=mode+" auth guard"
                      reject("/api/surf/"+mode)
                      reject("/api/surf/"+mode+"/stream.ts")
                      stage=mode+" control"
                      data=json.loads(small("/api/surf/"+mode,authorized=True))
                      if not isinstance(data,dict) or data.get("error"): raise ValueError("invalid control response")
                      print(mode,"authenticated controls: PASS",flush=True)
                      stage=mode+" stream"
                      t=time.monotonic()
                      chunks=[]; total=0
                      with request("/api/surf/"+mode+"/stream.ts",authorized=True) as r:
                          print(mode,"HTTP",r.status,"content-type",r.headers.get_content_type(),flush=True)
                          while total<1400000 and time.monotonic()-t<26:
                              chunk=r.read1(min(65536,1400000-total))
                              if not chunk: break
                              chunks.append(chunk);total+=len(chunk)
                      media=b"".join(chunks)
                      if len(media)<188*100: raise ValueError("insufficient media")
                      stage=mode+" decoding"
                      proc=subprocess.run(["ffmpeg","-v","error","-nostdin","-progress","pipe:1","-i","pipe:0","-map","0:v:0","-map","0:a:0","-f","null","-"],input=media,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=20)
                      frames=[int(l.split("=")[1].strip()) for l in proc.stdout.decode(errors="replace").splitlines() if l.startswith("frame=") and l.split("=")[1].strip().isdigit()]
                      count=max(frames,default=0)
                      print(mode,"bytes",len(media),"frames",count,"decoder exit",proc.returncode,"error lines",len(proc.stderr.splitlines()),flush=True)
                      if proc.returncode or count<25: raise ValueError("decode failed")
                      print(mode,"PASS continuous MPEG-TS",flush=True)
                  except E.HTTPError as e:
                      errors+=1;print(stage,"HTTP failure",e.code,flush=True)
                  except Exception as e:
                      errors+=1;print(stage,"FAIL",type(e).__name__,flush=True)
          except E.HTTPError as e:
              errors+=1;print(stage,"HTTP failure",e.code,flush=True)
          except Exception as e:
              errors+=1;print(stage,"FAIL",type(e).__name__,flush=True)
          finally:
              if token:
                  try: small("/Sessions/Logout","POST",authorized=True)
                  except Exception as e: errors+=1;print("Logout FAIL",type(e).__name__,flush=True)
          sys.exit(1 if errors else 0)
          PY
