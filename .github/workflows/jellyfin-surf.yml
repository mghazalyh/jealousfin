name: Real Jellyfin three-category Surf acceptance
on:
  push:
    branches: [diagnostics/jellyfin-connection-only]
    paths: ['.github/workflows/jellyfin-surf.yml']
  workflow_dispatch:
permissions: {}
jobs:
  surf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        category: [0, 1, 2]
    steps:
      - name: Ensure FFmpeg decoder is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Verify distinct HLS segments, video and audio, and cleanup
        env:
          JELLYFIN_TEST_URL: ${{ secrets.JELLYFIN_TEST_URL }}
          JELLYFIN_TEST_USERNAME: ${{ secrets.JELLYFIN_TEST_USERNAME }}
          JELLYFIN_TEST_PASSWORD: ${{ secrets.JELLYFIN_TEST_PASSWORD }}
          SURF_CATEGORY: ${{ matrix.category }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request as R,urllib.parse as U,urllib.error as E,ssl,uuid,time,sys,subprocess,hashlib
          base=os.environ["JELLYFIN_TEST_URL"].strip().rstrip("/")
          p=U.urlsplit(base)
          if p.scheme!="https" or not p.hostname or p.username or p.password or p.query or p.fragment: sys.exit("Invalid HTTPS base URL")
          if p.hostname.lower() != "desktop-hb9oshs.tail1fc8b.ts.net": sys.exit("Unexpected public tunnel hostname")
          def origin(url):
              q=U.urlsplit(url)
              return (q.scheme,q.hostname,q.port or (443 if q.scheme=="https" else 80))
          class NoRedirect(R.HTTPRedirectHandler):
              def redirect_request(self,*args): return None
          op=R.build_opener(NoRedirect(),R.HTTPSHandler(context=ssl.create_default_context()))
          token=None
          auth='MediaBrowser Client="Jealousfin Surf Diagnostics", Device="GitHub Actions", DeviceId="'+uuid.uuid4().hex+'", Version="1"'
          stage="startup"
          def call(path,method="GET",body=None,limit=4000000,media=False,raw=False):
              global stage
              url=U.urljoin(base+"/",path)
              if origin(url)!=origin(base): raise ValueError("cross-origin URL blocked")
              h={"Authorization":auth+(', Token="'+token+'"' if token else ""), "Accept":"*/*" if media else "application/json"}
              if token: h["X-Emby-Token"]=token
              if raw: h={"Accept":"*/*"}
              if body is not None: h["Content-Type"]="application/json"
              req=R.Request(url,data=json.dumps(body).encode() if body is not None else None,headers=h,method=method)
              t=time.monotonic()
              with op.open(req,timeout=20) as res:
                  data=res.read(limit+1)
                  if len(data)>limit: raise ValueError("response exceeds limit")
                  print(f"{stage}: HTTP {res.status}, {len(data)} bytes, {time.monotonic()-t:.2f}s",flush=True)
                  return (data,res.headers.get_content_type()) if media else (json.loads(data) if data else {})
          def query(path,**args): return path+"?"+U.urlencode(args)
          def mediaurl(url,ref):
              dest=U.urljoin(ref,url)
              if origin(dest)!=origin(base): raise ValueError("cross-origin media reference")
              parts=U.urlsplit(dest)
              q=[(k,v) for k,v in U.parse_qsl(parts.query,keep_blank_values=True) if k.lower() not in ("api_key","token","access_token")]
              q.append(("api_key",token))
              return U.urlunsplit(parts._replace(query=U.urlencode(q)))
          def child(ref,parent,limit):
              dest=U.urljoin(parent,ref)
              if origin(dest)!=origin(base): raise ValueError("cross-origin media reference")
              result=call(dest,limit=limit,media=True,raw=True)
              print("Client-style reference: PASS (no added credentials)",flush=True)
              return dest,result
          live=None; play=None; sid=None; channel=None; ok=False
          try:
              stage="Public identity"
              info=call("System/Info/Public")
              print("Server version:",info.get("Version"),flush=True)
              stage="Authentication"
              login=call("Users/AuthenticateByName","POST",{"Username":os.environ["JELLYFIN_TEST_USERNAME"],"Pw":os.environ["JELLYFIN_TEST_PASSWORD"]})
              token=login["AccessToken"]; uid=login["User"]["Id"]
              print("::add-mask::"+token,flush=True)
              stage="Live TV catalogue"
              items=call(query("LiveTv/Channels",UserId=uid,EnableUserData="true",Fields="Genres,Tags"))["Items"]
              print("Total channels:",len(items),flush=True)
              stage="Surf selection"
              matches=[x for x in items if "surf" in x.get("Name","").lower()]
              print("Surf-named channels:",len(matches),flush=True)
              if len(matches)!=3: raise ValueError("expected exactly three Surf categories")
              chosen=sorted(matches,key=lambda x:(x.get("Name","").casefold(),x["Id"]))[int(os.environ["SURF_CATEGORY"])]
              channel=chosen["Id"]
              print("Selected virtual Surf category:",repr(chosen.get("Name",""))[:100],flush=True)
              bitrate=3000000
              profile={"Name":"Jealousfin AVPlayer","MaxStreamingBitrate":bitrate,"DirectPlayProfiles":[{"Container":"mp4,m4v,mov","Type":"Video","VideoCodec":"h264,hevc","AudioCodec":"aac,mp3,ac3,eac3"}],"TranscodingProfiles":[{"Container":"ts","Type":"Video","Protocol":"hls","VideoCodec":"h264","AudioCodec":"aac","Context":"Streaming","MaxAudioChannels":"2","MinSegments":2}],"CodecProfiles":[],"SubtitleProfiles":[{"Format":"vtt","Method":"Hls"}]}
              stage="PlaybackInfo"
              result=call(query("Items/"+channel+"/PlaybackInfo",UserId=uid,IsPlayback="true",AutoOpenLiveStream="true"),"POST",{"UserId":uid,"MaxStreamingBitrate":bitrate,"EnableDirectPlay":False,"EnableDirectStream":False,"EnableTranscoding":True,"AutoOpenLiveStream":True,"DeviceProfile":profile})
              play=result.get("PlaySessionId")
              sources=result.get("MediaSources") or []
              print("Media source count:",len(sources), "error code:",bool(result.get("ErrorCode")),flush=True)
              if not sources: raise ValueError("no media source")
              src=sources[0]; live=src.get("LiveStreamId"); sid=src.get("Id",channel)
              print("Direct play:",bool(src.get("SupportsDirectPlay")),"Direct stream:",bool(src.get("SupportsDirectStream")),"Transcode:",bool(src.get("SupportsTranscoding")),"Live stream allocated:",bool(live),flush=True)
              stage="Stream URL"
              path=src.get("TranscodingUrl")
              if not path: raise ValueError("expected HLS transcoding URL")
              print("Transcoding URL present:",bool(src.get("TranscodingUrl")),flush=True)
              url=mediaurl(path,base+"/")
              stage="Stream response"
              if not src.get("TranscodingUrl"):
                  # Direct streams can be unbounded; read only a small prefix.
                  req=R.Request(url,headers={"X-Emby-Token":token,"Authorization":auth+', Token="'+token+'"'})
                  with op.open(req,timeout=20) as res:
                      data=res.read(65536)
                      print("Direct stream prefix:",res.status,len(data),"bytes",flush=True)
                      if not data: raise ValueError("empty direct stream")
                      print("Direct stream returned bytes; HLS and decoding not established",flush=True)
                  ok=True
              else:
                  data,ctype=call(url,limit=1000000,media=True,raw=True)
                  for depth in range(3):
                      stage="HLS manifest"
                      if not data.startswith(b"#EXTM3U"): raise ValueError("response is not HLS")
                      lines=data.decode("utf-8").splitlines()
                      refs=[x.strip() for x in lines if x.strip() and not x.startswith("#")]
                      if not refs: raise ValueError("manifest has no media references")
                      if any(x.startswith("#EXT-X-STREAM-INF") for x in lines):
                          url,(data,ctype)=child(refs[0],url,1000000)
                          continue
                      stage="HLS segment"
                      print("Media playlist entries:",len(refs),flush=True)
                      segments=[]; seen=set(); hashes=set(); total=0
                      deadline=time.monotonic()+25
                      while time.monotonic()<deadline and len(segments)<4:
                          for ref in refs:
                              dest=U.urljoin(url,ref)
                              if dest in seen: continue
                              seen.add(dest)
                              if origin(dest)!=origin(base): raise ValueError("cross-origin segment")
                              seg,ctype=call(dest,limit=4000000,media=True,raw=True)
                              if not seg: raise ValueError("empty segment")
                              digest=hashlib.sha256(seg).hexdigest()
                              if digest in hashes: continue
                              hashes.add(digest); total+=len(seg); segments.append(seg)
                              if total>12000000: raise ValueError("media budget exceeded")
                              if len(segments)>=4: break
                          if len(segments)>=4: break
                          time.sleep(2)
                          data,ctype=call(url,limit=1000000,media=True,raw=True)
                          if not data.startswith(b"#EXTM3U"): raise ValueError("invalid refreshed playlist")
                          refs=[x.strip() for x in data.decode("utf-8").splitlines() if x.strip() and not x.startswith("#")]
                      print("Distinct media segments:",len(segments),"bytes:",total,flush=True)
                      if len(segments)<3: raise ValueError("insufficient distinct segments")
                      stage="Timestamp continuity"
                      last=None
                      for index,segment in enumerate(segments):
                          probe=subprocess.run(["ffprobe","-v","error","-select_streams","v:0","-show_entries","packet=pts_time","-of","json","-i","pipe:0"],input=segment,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=10)
                          if probe.returncode: raise ValueError("timestamp probe failed")
                          pts=[]
                          for packet in json.loads(probe.stdout).get("packets",[]):
                              try: pts.append(float(packet["pts_time"]))
                              except (KeyError,ValueError,TypeError): continue
                          if len(pts)<3: raise ValueError("insufficient video timestamps")
                          first,end=min(pts),max(pts)
                          print("Segment",index+1,"PTS start:",round(first,3),"end:",round(end,3),flush=True)
                          if last is not None and end<=last: raise ValueError("video timestamps not advancing")
                          last=end
                      stage="FFmpeg video decode"
                      proc=subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-nostdin","-progress","pipe:1","-i","pipe:0","-map","0:v:0","-map","0:a:0","-f","null","-"],input=b"".join(segments),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=20)
                      frames=[int(line.split("=")[1].strip()) for line in proc.stdout.decode("utf-8","replace").splitlines() if line.startswith("frame=") and line.split("=")[1].strip().isdigit()]
                      count=max(frames,default=0)
                      print("FFmpeg return code:",proc.returncode,"decoded video frames:",count,flush=True)
                      print("Decoder error lines:",len(proc.stderr.splitlines()),flush=True)
                      if proc.returncode!=0 or count<3 or proc.stderr.strip(): raise ValueError("video or audio decode failed")
                      visual=subprocess.run(["ffmpeg","-v","error","-nostdin","-i","pipe:0","-map","0:v:0","-vf","fps=1,scale=64:36","-an","-f","framemd5","pipe:1"],input=b"".join(segments),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=20)
                      if visual.returncode: raise ValueError("frame fingerprint check failed")
                      fingerprints=[line.split(",")[-1].strip() for line in visual.stdout.decode("utf-8","replace").splitlines() if line and not line.startswith("#")]
                      print("Sampled frame fingerprints:",len(fingerprints),"distinct:",len(set(fingerprints)),flush=True)
                      if len(set(fingerprints))<2: print("WARNING: sampled video appears static; investigate content",flush=True)
                      if not seg: raise ValueError("empty segment")
                      print("Segment MPEG-TS sync byte:",seg[:1]==b"\x47",flush=True)
                      ok=True
                      break
                  if not ok: raise ValueError("playlist nesting exceeded")
          except E.HTTPError as e:
              print(f"{stage}: FAIL HTTP {e.code}",flush=True)
          except Exception as e:
              print(f"{stage}: FAIL {type(e).__name__}",flush=True)
          finally:
              if token:
                  if sid and play:
                      try:
                          stage="Playback stop"
                          body={"ItemId":channel,"MediaSourceId":sid,"PlaySessionId":play,"PositionTicks":0}
                          if live: body["LiveStreamId"]=live
                          call("Sessions/Playing/Stopped","POST",body)
                      except Exception as e: print("Playback stop failed:",type(e).__name__,flush=True); ok=False
                  if live:
                      try:
                          stage="Live stream close"
                          call(query("LiveStreams/Close",LiveStreamId=live),"POST")
                      except Exception as e: print("Live stream close failed:",type(e).__name__,flush=True); ok=False
                  try:
                      stage="Logout"
                      call("Sessions/Logout","POST")
                  except Exception as e: print("Logout failed:",type(e).__name__,flush=True); ok=False
          print("Bounded Surf transport result:", "PASS (distinct HLS segments and video/audio decode; not physical playback)" if ok else "FAIL",flush=True)
          sys.exit(0 if ok else 1)
          PY
