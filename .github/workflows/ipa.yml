name: Build and release Jealousfin IPA
on:
  push:
    branches: [main, engineering/hotpatch-abi2-20261125]
  workflow_dispatch:
    inputs:
      runner:
        description: Initial macOS runner pool
        type: choice
        default: macos-15-intel
        options: [macos-15-intel, macos-26-intel, macos-15]
permissions:
  contents: read
  actions: read
concurrency:
  group: jealousfin-ipa
  cancel-in-progress: false
jobs:
  primary:
    if: ${{ github.ref_name == 'main' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-ipa]') }}
    name: Jealousfin primary macOS
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 35
    steps: &native_steps
      - uses: actions/checkout@v4
      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Audit native-only release baseline
        run: python3 Scripts/audit-native-release.py
      - name: Generate reviewed baseline source
        run: python3 Scripts/embed-promoted.py Promoted/baseline.json Sources/PromotedBaseline.generated.swift
      - name: Verify toolchain
        run: |
          # Build 1015 was physically accepted on an iPad. Preserve its exact SDK.
          test -d /Applications/Xcode_16.4.app/Contents/Developer || { echo "::error::Accepted Xcode 16.4 toolchain unavailable on this runner"; exit 1; }
          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "18.5"
          test "$(xcodebuild -version | head -1)" = "Xcode 16.4"
          command -v xcodegen >/dev/null || brew install xcodegen
          bash Scripts/fetch-runtime.sh
      - name: Test channel policy
        run: |
          mkdir -p build
          swiftc Sources/Domain.swift Sources/EngineeringDomain.swift Sources/DynamicUIDomain.swift Sources/DecisionDomain.swift Sources/JellyfinAdapterDomain.swift Sources/PatchPromotionDomain.swift Sources/PromotedBaseline.generated.swift Tests/main.swift -o build/policy-tests
          build/policy-tests
          python3 -m unittest discover -s Tests -p 'test_*.py' -v
          python3 Server/iptv/test_policy_observer.py
          python3 Server/iptv/test_policy_snapshot.py
          python3 Server/iptv/test_gateway_policy.py
          python3 Server/iptv/test_endurance_acceptance.py
      - name: Test interruptible runtime
        run: |
          mkdir -p build/quickjs
          for f in Native/RuntimeBridge.c Vendor/QuickJS/{cutils,libregexp,libunicode,quickjs,xsum}.c; do
            clang -std=gnu11 -O2 -D_GNU_SOURCE -I Vendor/QuickJS -c "$f" -o "build/quickjs/$(basename "$f" .c).o"
          done
          swiftc -parse-as-library -import-objc-header Native/RuntimeBridge.h Sources/Domain.swift Sources/Runtime.swift Sources/RuntimeWorker.swift Sources/DynamicUIDomain.swift Sources/JellyfinAdapterDomain.swift Sources/JellyfinAdapterRuntime.swift Sources/EngineeringDomain.swift Sources/PatchPromotionDomain.swift Sources/PromotedBaseline.generated.swift Sources/Persistence.swift Sources/EngineeringRuntime.swift Sources/Jellyfin.swift Sources/HLSReadiness.swift Sources/BaselineInstaller.swift Sources/PatchVersionStore.swift Tests/HotPatchIntegration.swift Tests/RuntimeSmoke.swift build/quickjs/*.o -o build/runtime-tests
          build/runtime-tests
          swiftc -parse-as-library Sources/Domain.swift Sources/JellyfinAdapterDomain.swift Sources/HLSReadiness.swift Tests/HLSReadinessTests.swift -o build/hls-readiness-tests
          build/hls-readiness-tests
      - name: Generate project and build
        run: |
          set -euo pipefail
          build_number=$((1000 + GITHUB_RUN_NUMBER))
          echo "JEALOUSFIN_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          xcodegen generate
          xcodebuild -project Jealousfin.xcodeproj -scheme Jealousfin -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" IPHONEOS_DEPLOYMENT_TARGET=15.0 PRODUCT_BUNDLE_IDENTIFIER=com.example.jealousfin CURRENT_PROJECT_VERSION="$build_number" build
      - name: Package and verify public TrollStore IPA (PlayTorrio reference signing)
        run: bash Scripts/package-public-ipa.sh
      - name: Record reviewed baseline revision
        run: python3 -c 'import json;print(json.load(open("Promoted/baseline.json"))["revision"])' > build/baseline-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Jealousfin-IPA
          path: |
            build/Jealousfin.ipa
            build/Jealousfin.ipa.sha256
            build/Jealousfin-unsigned.ipa
            build/Jealousfin-unsigned.ipa.sha256
            build/baseline-revision.txt
          if-no-files-found: error
  primary-guard:
    needs: primary
    if: ${{ always() && !cancelled() && needs.primary.result == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.guard.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that no runner or build was started
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_JOB_NAME: Jealousfin primary macOS
        run: python3 Scripts/runner-fallback-guard.py
  rescue-intel:
    name: Jealousfin backup Intel
    needs: [primary, primary-guard]
    if: ${{ always() && !cancelled() && needs.primary-guard.outputs.eligible == 'true' }}
    runs-on: ${{ inputs.runner == 'macos-26-intel' && 'macos-15-intel' || 'macos-26-intel' }}
    timeout-minutes: 35
    steps: *native_steps
  intel-guard:
    needs: rescue-intel
    if: ${{ always() && !cancelled() && needs.rescue-intel.result == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.guard.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that backup never started
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_JOB_NAME: Jealousfin backup Intel
        run: python3 Scripts/runner-fallback-guard.py
  rescue-arm:
    name: Jealousfin backup Apple Silicon
    needs: [rescue-intel, intel-guard]
    if: ${{ always() && !cancelled() && needs.intel-guard.outputs.eligible == 'true' && inputs.runner != 'macos-15' }}
    runs-on: macos-15
    timeout-minutes: 35
    steps: *native_steps
  publish:
    name: Publish verified IPA once
    needs: [primary, rescue-intel, rescue-arm]
    if: ${{ always() && !cancelled() && (needs.primary.result == 'success' || needs.rescue-intel.result == 'success' || needs.rescue-arm.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Jealousfin-IPA
          path: packages
      - name: Verify archive checksums and metadata
        run: |
          set -euo pipefail
          cd packages
          sha256sum -c Jealousfin.ipa.sha256
          sha256sum -c Jealousfin-unsigned.ipa.sha256
          python3 - <<'VERIFY'
          import os, plistlib, zipfile
          for name in ("Jealousfin.ipa", "Jealousfin-unsigned.ipa"):
              with zipfile.ZipFile(name) as z:
                  assert z.testzip() is None
                  root = "Payload/Jealousfin.app/"
                  info = plistlib.loads(z.read(root+"Info.plist"))
                  assert info["CFBundleIdentifier"] == "com.example.jealousfin"
                  assert info["CFBundleVersion"] == str(1000+int(os.environ["GITHUB_RUN_NUMBER"]))
                  assert info["MinimumOSVersion"] == "15.0"
                  assert info["LSRequiresIPhoneOS"] is True
                  assert z.getinfo(root+"Jealousfin").external_attr >> 16 & 0o777 == 0o755
                  assert (root+"_CodeSignature/CodeResources" in z.namelist()) == (name=="Jealousfin.ipa")
                  assert root+"JealousfinDefaults.plist" not in z.namelist()
          VERIFY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_number=$((1000 + GITHUB_RUN_NUMBER))
          tag="v0.1.13-build${build_number}-${GITHUB_RUN_ATTEMPT}"
          baseline="$(cat packages/baseline-revision.txt)"
          notes="Ad hoc signed and unsigned iOS 15+ ARM64 Jealousfin packages using the build 1015 accepted packaging baseline. Source: $GITHUB_SHA. Reviewed baseline: $baseline. CI archive and signature checks passed. Build 1015 was physically accepted on iPad; this new build has not independently undergone physical installation testing."
          files=(packages/Jealousfin.ipa packages/Jealousfin.ipa.sha256 packages/Jealousfin-unsigned.ipa packages/Jealousfin-unsigned.ipa.sha256)
          release_flags=(--latest)
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            release_flags=(--prerelease --latest=false)
            notes="$notes Candidate branch: $GITHUB_REF_NAME. Existing stable release remains latest."
          fi
          gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Jealousfin 0.1.13 build $build_number" --notes "$notes" "${release_flags[@]}"
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            expected="$(stat -c%s "$f")"
            actual="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets | jq -r --arg n "$name" '.assets[] | select(.name == $n) | .size')"
            test "$expected" = "$actual"
          done
