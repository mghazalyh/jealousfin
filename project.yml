name: Jealousfin
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
targets:
  Jealousfin:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Native
      - path: Vendor/QuickJS
        excludes: [LICENSE, REVISION]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Jealousfin
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: Connect to Jellyfin and receive local playback commands.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jealousfin.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Native/RuntimeBridge.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/QuickJS"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) _GNU_SOURCE"
        CLANG_C_LANGUAGE_STANDARD: gnu11
schemes:
  Jealousfin:
    build:
      targets:
        Jealousfin: all
